<style>

@font-face{font-family:"Alegreya Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sans-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

@font-face{font-family:"Alegreya Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sans-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

:root{
  --t-torch:#e0913a; --t-lantern:#e8c547; --t-lightC:#7fb2e5; --t-lightMU:#b48ce0; --t-potion:#6cc08b; --t-custom:#e07a9a;
  --bg:#121317; --panel:#1b1d23; --panel2:#23262e; --line:#3a3e48; --text:#ebe6da; --muted:#a39e92;
  --accent:#e0913a; --accent-ink:#1a1206; --done:#4a4d55; --done-x:#f3efe4; --rest:#3f7a4c; --danger:#d0463b;
  --warn:#e0913a; --mark:#ffbf5e; --enc:rgba(208,70,59,.82); --box:clamp(22px, calc((100vw - 114px) / 12), 34px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#efe8d8; --panel:#f8f3e7; --panel2:#ebe3d0; --line:#b9ad94; --text:#2a241a; --muted:#6d6453;
    --accent:#b5621b; --accent-ink:#fff8ee; --done:#6b665c; --done-x:#fff; --rest:#4f8a5a; --danger:#b3261e; --mark:#ffcf7a; color-scheme:light; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 "Alegreya Sans",system-ui,sans-serif;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1,h2,h3,h4{font-family:"Alegreya SC",Georgia,serif;font-weight:700;margin:0;letter-spacing:.02em}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:22px;line-height:1.1;flex:1 1 auto;min-width:0}
.top h1 small{display:block;font-family:"Alegreya Sans",sans-serif;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.tools{display:flex;gap:6px;align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:38px;padding:0 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:#5fb36f}.pill.ro::before{background:#6c8fd6}.pill.bad::before{background:var(--danger)}.pill.wait::before{background:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}

/* Stats */
.stats{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:10px;align-items:stretch}
.stat{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;border-radius:10px;background:var(--panel2);min-width:0}
.stat .lbl{font-size:12px;color:var(--muted);line-height:1.15}
.stat b{font-size:18px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.stat.big{flex-direction:row;align-items:baseline;gap:6px;padding:6px 14px}
.stat.big .num{font-family:"Alegreya SC",serif;font-size:40px;line-height:1;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
@media (max-width:620px){ .stats{grid-template-columns:1fr 1fr} .stat.big{grid-column:1/-1;justify-content:center} }

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:0 20px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
.sep{width:1px;height:26px;background:var(--line)}
@media (max-width:620px){
  .controls{display:grid;grid-template-columns:repeat(3,1fr)}
  .controls .btn.primary{grid-column:1/-1;height:52px}
  .controls .sep{display:none}
  .controls .btn{padding:0 8px;font-size:15px}
}

/* Banner */
.banner{display:flex;align-items:center;gap:10px;background:var(--danger);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;animation:pop .25s ease-out}
.banner span{flex:1}
.banner button{background:transparent;border:0;color:#fff;cursor:pointer;padding:4px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}

/* Grid */
.gridhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.daynav{display:flex;align-items:center;gap:4px}
.daynav .cur{font-family:"Alegreya SC",serif;font-size:18px;padding:0 8px;cursor:pointer;background:none;border:0}
.daynav .cur.away{color:var(--accent);text-decoration:underline dotted}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend b{color:var(--text)}
.legend .sw{display:inline-block;width:16px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:3px;border:1px solid var(--line)}
.legend .bar{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:2px;margin-right:3px}
.legend .g{font-weight:700;color:var(--text)}
.grid{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
.hour{display:flex;flex-direction:column}
.labels{display:grid;grid-template-columns:repeat(6,var(--box))}
.labels span{font-size:10px;font-weight:700;text-align:right;padding-right:3px;height:12px;line-height:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:3px}
.boxes{display:grid;grid-template-columns:repeat(6,var(--box));border:1.5px solid var(--text);border-radius:3px;overflow:hidden;background:var(--panel)}
.hnum{font-size:10px;color:var(--muted);width:18px;font-variant-numeric:lining-nums tabular-nums}
.box{position:relative;height:var(--box);-webkit-touch-callout:none;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent}
.box:last-child{border-right:0}
.gm .box{cursor:pointer}
.gm .box:hover{outline:2px solid var(--accent);outline-offset:-2px}
.box > *{pointer-events:none}
.box.done{background:var(--done)}
.box.done::after{content:"\2715";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--box) * .5);color:var(--done-x);opacity:.7;pointer-events:none}
.box.rested{background:var(--rest)}
.box.enc{background:var(--enc)}
.box.next{box-shadow:inset 0 0 0 2px var(--accent)}
.box.due{box-shadow:inset 0 0 0 2px var(--rest);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(79,138,90,.22) 4px 6px)}
.box.next.due{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px var(--rest)}
.box .tn{position:absolute;left:2px;top:1px;font-size:8px;line-height:1;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;z-index:1}
.box.done .tn,.box.rested .tn,.box.enc .tn{color:rgba(255,255,255,.75)}
.box .ends{position:absolute;right:1px;top:0;font-size:9px;line-height:1.1;font-weight:700;z-index:2;text-shadow:0 0 2px #000,0 0 2px #000;letter-spacing:-.5px}
.box .chk{position:absolute;left:2px;bottom:3px;font-size:9px;line-height:1;font-weight:700;color:var(--muted);z-index:2}
.box.done .chk{color:#fff}
.box .chk.e{color:#fff}
.box .chk.q{color:var(--accent)}
.box .miss{position:absolute;right:2px;bottom:3px;font-size:10px;line-height:1;font-weight:700;color:#fff;background:var(--warn);border-radius:2px;padding:0 2px;z-index:2}
.box .bars{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse;gap:1px;z-index:1}
.box .bars i{display:block;height:3px;opacity:.95}
.box .bars i.s{margin-left:3px;border-top-left-radius:2px;border-bottom-left-radius:2px}
.box .bars i.e{margin-right:3px;border-top-right-radius:2px;border-bottom-right-radius:2px}
.tsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:2px}

/* Encounters */
.encbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card.encbar h4{border:0;margin:0;padding:0;font-size:16px;flex:1 1 auto}
.encbar select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 10px;min-width:0;flex:1 1 160px;max-width:100%}
.encd{font-weight:500;font-size:14px;opacity:.95;margin-top:2px}
.banner .items{flex:1;display:flex;flex-direction:column;gap:6px}
.banner .encd{font-weight:500}
.log .encd{color:var(--text);opacity:.85}
.tbl-help{font-size:13px;color:var(--muted);white-space:pre-line;background:var(--panel2);border-radius:8px;padding:6px 10px}
.field textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;min-height:180px}
.sheet h3.sub{font-size:17px;margin:4px 0 8px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}

/* Bottom */
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.bottom{grid-template-columns:1fr}}
.card h4{font-size:16px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.timer{display:grid;grid-template-columns:30px 1fr auto 28px;gap:8px;align-items:center;padding:4px 0}
.timer .mk{font-weight:700;text-align:center;color:var(--accent)}
.timer.warn{color:var(--warn);font-weight:700}
.timer .left{font-variant-numeric:lining-nums tabular-nums;color:var(--muted);text-align:right;line-height:1.2}
.timer .left small{display:block;font-size:12px}
.timer.warn .left{color:var(--warn)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;display:inline-flex}
.x:hover{color:var(--danger)}
.empty{color:var(--muted);font-style:italic}
.log{max-height:260px;overflow-y:auto}
.log li{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}
.log li:last-child{border-bottom:0}
.log .tn{color:var(--muted);white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;min-width:52px}
.log .enc{color:var(--danger);font-weight:700}
.log .die{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--line);border-radius:5px;font-weight:700;margin-right:4px;font-variant-numeric:lining-nums tabular-nums}
textarea.notes{width:100%;min-height:130px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea.notes:read-only{opacity:.85}

/* Compact */
.compact .hide-compact{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:14px;white-space:nowrap}
.chip.warn{color:var(--warn);border-color:var(--warn);font-weight:700}
.chip .x{padding:2px}

/* Player counter */
.counter{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:6px;align-items:center}
.counter .num{font-family:"Alegreya SC",serif;font-size:84px;line-height:1;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.counter .sub{font-size:18px;color:var(--muted)}
.counter .row2{display:flex;gap:22px;font-size:18px;margin-top:10px;flex-wrap:wrap;justify-content:center}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sheet h3{font-size:20px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.field .lab{font-weight:500}
.field .hint{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field.check{flex-direction:row;align-items:flex-start;gap:10px}
.field.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.sheet hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.sheet p{margin:0 0 10px}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{white-space:pre-line;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .2s ease-out;font-size:15px}
.toast.bad{border-left-color:var(--danger)}.toast.good{border-left-color:#5fb36f}
.kbd{font-size:12px;color:var(--muted);text-align:center}
.kbd kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:inherit}
@media (hover:none){.kbd{display:none}}
.install{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:15px}
.install span{flex:1}
.install .share{display:inline-block;vertical-align:-3px}
html.standalone body{overscroll-behavior-y:none}
.touch-only{display:none}
@media (hover:none){.touch-only{display:inline}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1 id="hTitle"></h1>
    <span class="pill wait" id="status"></span>
    <div class="tools">
      <button class="iconbtn" data-action="lang" id="langBtn"></button>
      <button class="iconbtn" data-action="compact" id="compactBtn"></button>
      <button class="iconbtn" data-action="settings" id="settingsBtn"></button>
    </div>
  </header>
  <div class="install" id="install" hidden></div>
  <div id="main"></div>
  <section class="bottom hide-compact" id="bottom">
    <div class="card" id="timersCard"><h4 id="hTimers"></h4><ul class="list" id="timers"></ul></div>
    <div class="card" id="logCard"><h4 id="hLog"></h4><ul class="list log" id="log"></ul></div>
    <div class="card" id="notesCard" style="grid-column:1/-1"><h4 id="hNotes"></h4><textarea class="notes" id="notes"></textarea></div>
  </section>
  <div class="kbd hide-compact" id="kbd"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <form id="mForm" autocomplete="off">
      <div id="mBody"></div>
      <div class="mBtns"><button type="button" class="btn ghost" id="mCancel"></button><button type="submit" class="btn primary" id="mOk"></button></div>
    </form>
  </div>
</div>
<div id="toasts"></div>

<script>
(() => {
"use strict";

/* ---------------- Constants ---------------- */
const TURNS_PER_HOUR = 6, HOURS_PER_DAY = 24, TURNS_PER_DAY = 144;
const PRESETS = {
  torch:   { duration: "6" },
  lantern: { duration: "24" },
  lightC:  { duration: "12" },
  lightMU: { duration: "7" },
  potion:  { duration: "1d6+6" },
  custom:  { duration: "6" }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clampInt = (v, lo, hi, d) => { v = Math.floor(Number(v)); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function rnd(sides) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % sides) + 1; }
  catch { return Math.floor(Math.random() * sides) + 1; }
}
function rollFormula(f) {
  const s = String(f).replace(/\s+/g, "").toLowerCase().replace(/к/g, "d");
  if (!s || !/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s)) return null;
  let total = 0, dice = false;
  for (const m of s.matchAll(/([+-]?)(?:(\d*)d(\d+)|(\d+))/g)) {
    const sign = m[1] === "-" ? -1 : 1;
    if (m[3] !== undefined) {
      const n = Math.min(100, m[2] === "" ? 1 : Number(m[2])), sides = Math.min(1000, Number(m[3]));
      if (!sides) return null;
      dice = true;
      for (let i = 0; i < n; i++) total += sign * rnd(sides);
    } else total += sign * Number(m[4]);
  }
  return { total, dice };
}
function fmtElapsed(turns) {
  const min = turns * 10;
  return T().fmt(Math.floor(min / 1440), Math.floor((min % 1440) / 60), min % 60);

/* ---------------- Encounter tables ---------------- */
function rollDie(die) {

}
function parseTable(text, die) {

    if (rm) { a = Number(rm[1]); b = rm[2] ? Number(rm[2]) : a; line = line.slice(rm[0].length); }
    const pi = line.indexOf("|"); if (pi >= 0) { x = line.slice(pi + 1).trim(); line = line.slice(0, pi).trim(); }
    const cm = /^(\d*[dDкК]\d+(?:\s*[+-]\s*\d+)?|\d+)\s+(.+)$/.exec(line);
    if (cm) { c = cm[1].replace(/\s+/g, "").replace(/[кК]/g, "d").toLowerCase(); line = cm[2]; }
    if (!line) continue;

    if (b < a) [a, b] = [b, a];
    next = b + 1;

let state = blank();
let mode = "conn";          // conn | local | shared
let canWrite = false;       // referee controls visible
let connState = "conn";     // conn | sync | off
let viewDay = null;         // null = follow current turn
let banner = null;          // { items: [{ n, d, manual }] }
let db = null, docRef = null, writing = false, dirty = false, loadTimer = null, loaded = false;

/* ---------------- Persistence ---------------- */
function loadLocal() { try { return sanitize(JSON.parse(localStorage.getItem(LS_STATE))); } catch { return blank(); } }
function saveLocal() { try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch {} }

async function flush() {
  if (!docRef || writing) return;
  writing = true; renderStatus();
  try {
    while (dirty) {
      dirty = false;
      const body = clone(state);
      try { await docRef.set(body); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); await docRef.set(clone(state)); }
        else throw e;
      }
    }
    connState = "sync";
  } catch (e) {
    dirty = false;
    const code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted") { canWrite = false; toast(T().writeDenied, "bad"); }
    else if (code === "quota_exceeded") toast(T().quota, "bad");
    else toast(T().writeFail, "bad");
    try { const snap = await docRef.get(); state = sanitize(snap.exists ? clone(snap.data()) : null); } catch {}
  } finally { writing = false; render(); }
}

function commit() {
  state.rev = (state.rev || 0) + 1;
  prune(state);
  render();
  if (mode === "local") saveLocal();
  else if (mode === "shared") { dirty = true; flush(); }
}

/* ---------------- Turn logic ---------------- */
function advanceTo(s, target) {
  target = Math.max(0, Math.floor(target));
  const prev = s.turn;
  const ev = { encounters: [], quiet: [], rest: [], expired: [], det: [] };
  if (target > prev) {
    const { wInt, rInt, wChance, autoRoll, hideRolls } = s.settings;
    const add = [];
    for (let n = prev + 1; n <= target; n++) {
      if (n % wInt === 0) {
        if (autoRoll) {
          const r = rnd(6), enc = r <= wChance;
          const det = enc ? encounterDetails(s) : undefined;
          add.push({ id: rid(), t: "w", n, r, e: enc, gm: hideRolls, d: det });
          s.checks.push(det ? [n, r, enc, det] : [n, r, enc]);
          if (enc) ev.det.push({ n, d: det });
          (enc ? ev.encounters : ev.quiet).push({ n, r });
        } else { add.push({ id: rid(), t: "w", n, r: null, e: null, gm: false }); s.checks.push([n, null, null]); }
      }
      if (n % rInt === 0 && !s.rests.some(x => x > n - rInt && x <= n)) { add.push({ id: rid(), t: "mr", n }); ev.rest.push(n); }
      for (const t of s.timers) if (t.end === n) { add.push({ id: rid(), t: "x", n, l: t.label }); ev.expired.push(t.label); }
    }
    s.log = add.reverse().concat(s.log);
  } else if (target < prev) {
    // Undo: forget checks and rests in the turns that were un-ticked
    s.checks = s.checks.filter(c => c[0] <= target);
    s.rests = s.rests.filter(r => r <= target);
  }
  s.turn = target;
  return { ev, delta: target - prev };
}

function setTurn(target, { isRest = false } = {}) {
  if (!canWrite) return;
  const s = state;
  const prevTurn = s.turn;
  if (isRest) { s.rests.push(s.turn + 1); s.log.unshift({ id: rid(), t: "rest", n: s.turn + 1 }); }
  const { ev, delta } = advanceTo(s, target);
  if (delta === 0 && !isRest) return;
  viewDay = null;
  if (delta > 0) {
    banner = ev.det.length ? { items: ev.det } : null;
    if (!ev.encounters.length && ev.quiet.length === 1 && delta === 1) toast(`${T().turnShort(ev.quiet[0].n)} · d6 = ${ev.quiet[0].r} — ${T().noEncounter}`, "good");
    else if (!ev.encounters.length && ev.quiet.length > 1) toast(`${ev.quiet.length}× d6 — ${T().noEncounter}`, "good");
    if (ev.rest.length) toast((delta > 1 && ev.rest.length === 1 ? T().turnShort(ev.rest[0]) + ": " : "") + T().mustRest);
    if (ev.expired.length) toast(ev.expired.map(l => T().expired(l)).join(" "));

  if (!canWrite) return false;
  let turns = Number(duration), f;
  if (!Number.isFinite(turns)) {
    const r = rollFormula(duration);
    if (!r) { toast(T().badFormula, "bad"); return false; }
    turns = r.total; f = String(duration).replace(/\s+/g, "");
  }
  turns = Math.max(1, Math.floor(turns));
  label = (label || T().preset[type] || T().preset.custom).slice(0, 80);
  state.timers.push({ id: rid(), label, type, start: state.turn, end: state.turn + turns });
  state.log.unshift({ id: rid(), t: "add", n: state.turn, l: label, f, v: turns });
  if (f) toast(T().added(label, f, turns));

/* ---------------- Rendering ---------------- */
const curDay = () => Math.floor(Math.max(state.turn - 1, 0) / TURNS_PER_DAY);
const shownDay = () => viewDay ?? curDay();
function view() {
  if (mode === "conn" || (mode === "shared" && !loaded)) return "loading";
  if (canWrite) return "gm";
  return "player-" + state.settings.playerView;
}

function gridCtx(isGM) {
  const s = state, { wInt, rInt, hideRolls } = s.settings;

  const rests = new Set(s.rests);
  const restOk = n => s.rests.some(x => x > n - rInt && x <= n);
  const nextW = Math.ceil((s.turn + 1) / wInt) * wInt;
  const nextR = Math.ceil((s.turn + 1) / rInt) * rInt;

  const L = T(), s = state;
  let labels = "", boxes = "";
  for (let i = 1; i <= TURNS_PER_HOUR; i++) {
    const n = hour * TURNS_PER_HOUR + i;
    const tod = n - Math.floor((n - 1) / TURNS_PER_DAY) * TURNS_PER_DAY;
    labels += `<span>${n % g.wInt === 0 ? L.letterW : ""}${n % g.rInt === 0 ? L.letterR : ""}</span>`;
    const cls = ["box"], tip = [`${L.turnShort(n)} (${L.tip.day(Math.floor((n - 1) / TURNS_PER_DAY) + 1)}) · ${fmtElapsed(n)}`];
    let inner = `<span class="tn">${tod}</span>`;
    if (n <= s.turn) cls.push("done");
    if (n === s.turn + 1) cls.push("next");

    // Rest
    if (g.rests.has(n)) { cls.push("rested"); tip.push(L.rested); }
    else if (n % g.rInt === 0 && !g.restOk(n)) {
      if (n <= s.turn) { inner += `<span class="miss">!</span>`; tip.push(L.tip.restMiss); }
      else if (n === g.nextR) { cls.push("due"); tip.push(L.tip.restDue); }
    }

    // Wandering check
    const c = g.checks.get(n);
    if (c && n <= s.turn) {
      if (!g.showRolls) { inner += `<span class="chk">•</span>`; tip.push(L.tip.checkHidden); }
      else if (c[1] == null) { inner += `<span class="chk">?</span>`; tip.push(L.tip.checkManual); }
      else {
        if (c[2]) cls.push("enc");
        inner += `<span class="chk ${c[2] ? "e" : ""}">${c[1]}</span>`;
        tip.push(L.tip.check(c[1], c[2]));

}

function renderStatus() {
  const L = T(), el = $("status");

  else if (mode === "local") { key = "local"; cls = "wait"; }
  else if (connState === "off") { key = "off"; cls = "bad"; }
  else if (!canWrite) { key = "ro"; cls = "ro"; }
  else if (writing || dirty) { key = "saving"; cls = "wait"; }
  else { key = "sync"; cls = "ok"; }
  el.hidden = mode === "local";
  el.className = "pill " + cls;
  el.textContent = L.st[key];
  el.title = L.stTip[key] || L.stTip.sync;
}

  const app = $("app");

  document.title = L.title + " · OSE";
  app.classList.toggle("gm", v === "gm");
  app.classList.toggle("compact", compact);
  $("hTitle").innerHTML = `${esc(L.title)}<small>${esc(L.subtitle)}</small>`;
  $("langBtn").textContent = L.langName;
  $("langBtn").title = prefs.lang === "uk" ? "English" : "Українська";
  $("compactBtn").innerHTML = ic(prefs.compact ? "grow" : "shrink");
  $("compactBtn").title = prefs.compact ? L.expand : L.compact;
  $("compactBtn").hidden = !(v === "gm" || v === "player-full");
  $("settingsBtn").innerHTML = ic("gear");
  $("settingsBtn").title = L.settings;
  $("settingsBtn").hidden = v !== "gm";
  renderStatus();

  const main = $("main"), bottom = $("bottom");
  const showBottom = v === "gm" || v === "player-full";
  bottom.hidden = !showBottom;
  $("kbd").hidden = v !== "gm";
  $("kbd").innerHTML = L.keys;

  if (v === "loading") { main.innerHTML = `<div class="card counter"><div class="sub">${esc(connState === "off" ? L.stTip.off : L.loading)}</div></div>`; return; }
  if (v === "player-off") { main.innerHTML = `<div class="card counter"><div class="sub">${esc(L.offView)}</div></div>`; return; }
  if (v === "player-counter") {
    main.innerHTML = `<div class="card counter"><div class="num">${state.turn}</div><div class="sub">${esc(L.turns(state.turn))}</div>
      <div class="row2"><span>${esc(L.elapsed)}: <b>${esc(fmtElapsed(state.turn))}</b></span><span>${esc(L.day)} <b>${curDay() + 1}</b></span></div></div>`;
    return;
  }

  const isGM = v === "gm", s = state;
  const nextW = Math.ceil((s.turn + 1) / s.settings.wInt) * s.settings.wInt - s.turn;

function renderInstall() {
  const el = $("install"), L = T();
  if (isStandalone() || prefs.hideInstall || !(isIOS || deferredPrompt)) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = (deferredPrompt
    ? `<span><b>${esc(L.installBtn)}</b><br>${esc(L.installText)}</span><button class="btn primary" data-action="install" style="height:38px;font-size:15px">${esc(L.installBtn)}</button>`
    : `<span>${esc(L.installIos).replace("SHARE", SHARE_SVG)}</span>`)
    + `<button class="x" data-action="hideInstall" aria-label="✕">${ic("x")}</button>`;
}
actions.install = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch {}
  deferredPrompt = null; renderInstall();
};
actions.hideInstall = () => { prefs.hideInstall = true; savePrefs(); renderInstall(); };
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; renderInstall(); });
const _render = render;
render = function () { _render(); renderInstall(); };

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    try { sessionStorage.setItem("osedtt.updated", "1"); } catch {}
    location.reload();
  });
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
try { if (sessionStorage.getItem("osedtt.updated")) { sessionStorage.removeItem("osedtt.updated"); setTimeout(() => toast(T().updated, "good"), 300); } } catch {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

boot();
})();

</script>
</body>
</html>
